# Spec 001 REQ-004 (quality gates) and REQ-008 (secret scanning).
# Read-only: this workflow never deploys, pushes or merges.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      # Without generated route types, tsc passes but does not enforce typed routes.
      - name: Generate typed routes
        run: npm run typegen

      - run: npm run typecheck

      - name: Invalid-route type test (REQ-003)
        run: npm run test:types

      - run: npm run lint
      - run: npm test
      - run: npm run export:web

      - name: Server-rendering smoke test (Spec 002 S28)
        run: npm run ssr:smoke

      - name: No privileged keys in the web build (Spec 002 S29)
        run: npm run check:bundle

      # Blocking since the Expo SDK 58 upgrade resolved ADR-0006.
      - name: Dependency audit (high severity fails)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned release, verified against the published SHA-256 checksums (ADR-0007).
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner

  # Spec 002 REQ-044, REQ-045, REQ-046: migrations, RLS and type drift on a
  # disposable local database. Never connects to the hosted project.
  database:
    name: Database migrations and authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start a disposable local Supabase stack (migrations and seed)
        run: supabase start -x realtime,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,studio

      - name: pgTAP tests (allowed and denied access)
        run: supabase test db

      - name: Generated types match the migrations
        run: |
          supabase gen types --lang=typescript --local > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/database.types.ts "$RUNNER_TEMP/database.types.ts"
