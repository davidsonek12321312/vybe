# Spec 001 REQ-004 (quality gates) and REQ-008 (secret scanning).
# Read-only: this workflow never deploys, pushes or merges.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, web export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from lockfile
        run: npm ci --no-audit --no-fund

      # Without generated route types, tsc passes but does not enforce typed routes.
      - name: Generate typed routes
        run: npm run typegen

      - run: npm run typecheck

      - name: Invalid-route type test (REQ-003)
        run: npm run test:types

      - run: npm run lint
      - run: npm test
      - run: npm run export:web

      # Blocking since the Expo SDK 58 upgrade resolved ADR-0006.
      - name: Dependency audit (high severity fails)
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned release, verified against the published SHA-256 checksums (ADR-0007).
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          echo "${{ runner.temp }}" >> "$GITHUB_PATH"

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
